name: Release APK (Claude feedback build)
# Builds an installable APK and publishes it as a GitHub release.
# Runs for a push to a claude/** branch whose last commit message contains [release]
# (the release tag is then created here), or by hand from the Actions tab.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Claude helper tests
        run: python3 -m unittest discover -s app/src/test/python

      # A debug build: installable as is, signed with the runner's debug key.
      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: claude-build-${{ github.run_number }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$apk" "notable-claude-$TAG.apk"
          cat > notes.md <<'EOF'
          Notable with Claude feedback: snapshot the page, get feedback from Claude Code in Termux.

          **Install:** this APK is signed differently from the official Notable, so uninstall the official app first.
          Your notes are kept: they live in `Documents/notabledb`, outside the app (back that folder up anyway).

          **Setup:** Settings → Claude → copy the setup command into Termux, then tap Check setup.
          Details: `docs/claude-feedback.md`.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Notable + Claude ($TAG)" \
            --notes-file notes.md --latest \
            "notable-claude-$TAG.apk"
